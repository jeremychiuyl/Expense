<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker & Dashboard</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        input[type="date"], input[type="month"] {
            min-height: 2.25rem;
            -webkit-appearance: none;
            appearance: none;
            color-scheme: dark;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-20 md:pb-6">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="bg-blue-600 p-2 rounded-lg text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-wallet text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-tight">ExpenseFlow</h1>
                    <p class="text-[10px] text-slate-400 flex items-center space-x-1">
                        <span id="syncStatus" class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span>
                        <span id="syncText">Connecting cloud...</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div id="activeFilterBadge" class="hidden items-center space-x-1 bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[11px] px-2 py-1 rounded-lg">
                    <span id="filterBadgeText">Filter</span>
                    <button onclick="clearCategoryFilter()" class="hover:text-white ml-0.5"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <!-- Refresh Button -->
                <button onclick="manualRefresh()" id="refreshBtn" title="Sync data" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                </button>

                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-md shadow-blue-600/30 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-3 py-3 w-full flex-grow space-y-3">

        <!-- Top 3 KPI Summary Cards with Icons -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-slate-400 font-medium uppercase tracking-wider">
                    <span>Total</span>
                    <div class="w-5 h-5 rounded-md bg-blue-500/10 text-blue-400 flex items-center justify-center">
                        <i class="fa-solid fa-coins text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiTotal" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>

            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-emerald-400 font-medium uppercase tracking-wider truncate">
                    <span id="kpiMonthName" class="truncate">This Month</span>
                    <div class="w-5 h-5 rounded-md bg-emerald-500/10 text-emerald-400 flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-calendar-days text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiMonth" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>

            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-slate-400 font-medium uppercase tracking-wider">
                    <span>Daily Avg</span>
                    <div class="w-5 h-5 rounded-md bg-amber-500/10 text-amber-400 flex items-center justify-center">
                        <i class="fa-solid fa-chart-line text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiDailyAvg" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>
        </div>

        <!-- Compact Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
            <!-- Spending Trend Line Chart -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800/80 rounded-xl p-3.5 flex flex-col">
                <div class="flex justify-between items-center gap-2 mb-2">
                    <h2 class="font-semibold text-xs text-slate-200">Spending Trend</h2>
                    <div class="flex items-center space-x-1.5">
                        <select id="trendViewMode" class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2 py-1 text-slate-300 focus:outline-none" onchange="updateCharts()">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <input type="month" id="trendMonthSelect" class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2 py-1 text-slate-200 focus:outline-none" onchange="handleMonthChange(this)">
                    </div>
                </div>
                <div class="relative h-48 sm:h-52 w-full">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Gauge Chart / Budget Threshold -->
            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5 flex flex-col justify-between cursor-pointer group" onclick="promptBudgetThreshold()" title="Click to set monthly budget">
                <div class="flex justify-between items-center">
                    <h2 class="font-semibold text-xs text-slate-200">Budget Limit</h2>
                    <i class="fa-solid fa-gear text-slate-500 group-hover:text-blue-400 text-[10px]"></i>
                </div>
                <div class="relative h-32 flex justify-center items-center my-1">
                    <canvas id="gaugeChart"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-3">
                        <span id="gaugePercentage" class="text-lg font-bold text-slate-100">0%</span>
                        <span class="text-[9px] text-slate-400">used</span>
                    </div>
                </div>
                <div class="text-center text-[11px] text-slate-300 bg-slate-800/40 py-1 rounded-lg border border-slate-800">
                    Budget: <span id="budgetLimitText" class="font-semibold text-slate-100">$500.00</span>
                </div>
            </div>
        </div>

        <!-- Category Breakdown Section -->
        <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5">
            <h2 class="font-semibold text-xs text-slate-200 mb-2">Categories <span class="text-[10px] text-slate-400 font-normal">(Tap to filter)</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                <div class="relative h-40 flex justify-center items-center">
                    <canvas id="categoryChart"></canvas>
                </div>
                <div id="categoryLegend" class="md:col-span-2 space-y-1.5 overflow-y-auto max-h-40 pr-1 text-xs"></div>
            </div>
        </div>

        <!-- Transactions Section -->
        <div id="transactionsSection" class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5">
            <div class="flex justify-between items-center gap-2 mb-3">
                <h2 class="font-semibold text-xs text-slate-200">History</h2>
                <div class="flex items-center space-x-1.5">
                    <input type="text" id="searchInput" placeholder="Search..." class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none w-28 sm:w-36" oninput="renderTransactions()">
                    <select id="filterCategory" class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2 py-1 text-slate-300 focus:outline-none" onchange="onCategorySelectFilter(this.value)">
                        <option value="">All</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div id="transactionList" class="divide-y divide-slate-800/50 max-h-56 overflow-y-auto pr-1 text-xs"></div>
        </div>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2.5 flex justify-around items-center z-30">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center text-blue-500 text-[10px]">
            <i class="fa-solid fa-chart-pie text-base mb-0.5"></i>
            <span>Dashboard</span>
        </button>
        <button onclick="openModal()" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md shadow-blue-500/40 -mt-5 border-2 border-slate-950">
            <i class="fa-solid fa-plus text-sm"></i>
        </button>
        <button onclick="scrollToHistory()" class="flex flex-col items-center text-slate-400 text-[10px] hover:text-slate-200">
            <i class="fa-solid fa-list-ul text-base mb-0.5"></i>
            <span>History</span>
        </button>
    </div>

    <!-- Add/Edit Modal -->
    <div id="expenseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-4 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 id="modalTitle" class="font-bold text-sm text-slate-100">Add Expense</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="expenseForm" onsubmit="saveExpense(event)" class="space-y-3 text-xs">
                <input type="hidden" id="expenseId">
                <div>
                    <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Title</label>
                    <input type="text" id="title" required placeholder="e.g., Lunch" class="w-full h-9 bg-slate-800 border border-slate-700 rounded-lg
