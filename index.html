<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Expense Tracker & Dashboard</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Chart.js & Chart.js Zoom Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overscroll-behavior-y: contain;
        }

        input, select, textarea {
            font-size: 16px !important;
            -webkit-appearance: none;
            appearance: none;
            color-scheme: dark;
        }

        input[type="date"], input[type="month"] {
            min-height: 2.25rem;
        }

        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-20 md:pb-6">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="bg-blue-600 p-2 rounded-lg text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-wallet text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-tight">ExpenseFlow</h1>
                    <p class="text-[10px] text-slate-400 flex items-center space-x-1">
                        <span id="syncStatus" class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span>
                        <span id="syncText">Connecting cloud...</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div id="activeFilterBadge" class="hidden items-center space-x-1 bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[11px] px-2 py-1 rounded-lg">
                    <span id="filterBadgeText">Filter</span>
                    <button onclick="clearCategoryFilter()" class="hover:text-white ml-0.5"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <button onclick="manualRefresh()" id="refreshBtn" title="Sync data" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                </button>

                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-md shadow-blue-600/30 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-3 py-3 w-full flex-grow space-y-3">

        <!-- Top KPI Summary Cards (4 Columns Now) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-slate-400 font-medium uppercase tracking-wider">
                    <span>Today</span>
                    <div class="w-5 h-5 rounded-md bg-blue-500/10 text-blue-400 flex items-center justify-center">
                        <i class="fa-solid fa-coins text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiToday" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>

            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-emerald-400 font-medium uppercase tracking-wider truncate">
                    <span id="kpiMonthName" class="truncate">Month Range</span>
                    <div class="w-5 h-5 rounded-md bg-emerald-500/10 text-emerald-400 flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-calendar-days text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiMonth" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>

            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-slate-400 font-medium uppercase tracking-wider">
                    <span>Daily Avg</span>
                    <div class="w-5 h-5 rounded-md bg-amber-500/10 text-amber-400 flex items-center justify-center">
                        <i class="fa-solid fa-chart-line text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiDailyAvg" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>

            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 sm:p-3 relative overflow-hidden">
                <div class="flex items-center justify-between text-[10px] text-indigo-400 font-medium uppercase tracking-wider">
                    <span>Weekly Avg</span>
                    <div class="w-5 h-5 rounded-md bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                        <i class="fa-solid fa-chart-column text-[10px]"></i>
                    </div>
                </div>
                <div id="kpiWeeklyAvg" class="text-base sm:text-lg font-bold mt-1 text-slate-100">$0.00</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800/80 rounded-xl p-3.5 flex flex-col">
                <div class="flex justify-between items-center gap-2 mb-2">
                    <div class="flex items-center space-x-2">
                        <h2 class="font-semibold text-xs text-slate-200">Spending Trend</h2>
                        <button onclick="resetTrendZoom()" title="Reset Zoom" class="text-[9px] text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 px-2 py-0.5 rounded transition">Reset Zoom</button>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <select id="trendViewMode" class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2 py-1 text-slate-300 focus:outline-none" onchange="updateAll()">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <input type="month" id="trendMonthSelect" class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2 py-1 text-slate-200 focus:outline-none" onchange="handleMonthChange(this)">
                    </div>
                </div>
                <div class="relative h-48 sm:h-52 w-full">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5 flex flex-col justify-between cursor-pointer group" onclick="promptBudgetThreshold()" title="Click to set monthly budget">
                <div class="flex justify-between items-center">
                    <h2 class="font-semibold text-xs text-slate-200">Budget Limit</h2>
                    <i class="fa-solid fa-gear text-slate-500 group-hover:text-blue-400 text-[10px]"></i>
                </div>
                <div class="relative h-32 flex justify-center items-center my-1">
                    <canvas id="gaugeChart"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-3">
                        <span id="gaugePercentage" class="text-lg font-bold text-slate-100">0%</span>
                        <span class="text-[9px] text-slate-400">used</span>
                    </div>
                </div>
                <div class="text-center text-[11px] text-slate-300 bg-slate-800/40 py-1 rounded-lg border border-slate-800">
                    Budget: <span id="budgetLimitText" class="font-semibold text-slate-100">$500.00</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5">
            <h2 class="font-semibold text-xs text-slate-200 mb-2">Categories <span class="text-[10px] text-slate-400 font-normal">(Tap to filter)</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                <div class="relative h-36 flex justify-center items-center">
                    <canvas id="categoryChart"></canvas>
                </div>
                <div id="categoryLegend" class="md:col-span-2 grid grid-cols-2 gap-1.5 text-xs"></div>
            </div>
        </div>

        <div id="transactionsSection" class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5">
            <div class="flex justify-between items-center gap-2 mb-3">
                <h2 class="font-semibold text-xs text-slate-200">History</h2>
                <div class="flex items-center space-x-1.5">
                    <input type="text" id="searchInput" placeholder="Search..." class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none w-28 sm:w-36" oninput="renderTransactions()">
                    <select id="filterCategory" class="bg-slate-800 border border-slate-700 text-[10px] rounded-lg px-2 py-1 text-slate-300 focus:outline-none" onchange="onCategorySelectFilter(this.value)">
                        <option value="">All</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div id="transactionList" class="divide-y divide-slate-800/50 max-h-56 overflow-y-auto pr-1 text-xs"></div>
        </div>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2.5 flex justify-center items-center z-30">
        <div class="flex flex-col items-center text-blue-500 text-[10px]">
            <i class="fa-solid fa-chart-pie text-base mb-0.5"></i>
            <span>Dashboard</span>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="expenseModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden items-center justify-center p-3">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-4 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 id="modalTitle" class="font-bold text-sm text-slate-100">Add Expense</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="expenseForm" onsubmit="saveExpense(event)" class="space-y-3 text-xs">
                <input type="hidden" id="expenseId">
                <div>
                    <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Title</label>
                    <input type="text" id="title" required placeholder="e.g., Lunch" class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg px-3 text-slate-200 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg px-3 text-slate-200 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Date</label>
                        <input type="date" id="date" required class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg px-2 text-slate-200 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Category</label>
                        <select id="category" class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg px-2 text-slate-200 focus:outline-none">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Method</label>
                        <select id="paymentMethod" class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg px-2 text-slate-200 focus:outline-none">
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Octopus">Octopus</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-3 py-2.5 rounded-lg bg-slate-800 text-slate-300">Cancel</button>
                    <button type="submit" class="px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Integration & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        Chart.register(window.ChartZoom);

        const firebaseConfig = {
            apiKey: "AIzaSyAUeMO4fqkKGUUu8rWW_WaFRElJxOBBJoE",
            authDomain: "expense-looker.firebaseapp.com",
            databaseURL: "https://expense-looker-default-rtdb.firebaseio.com",
            projectId: "expense-looker",
            storageBucket: "expense-looker.firebasestorage.app",
            messagingSenderId: "303121746419",
            appId: "1:303121746419:web:1c9f038a65f21a7c3c2a86",
            measurementId: "G-H5JTCLSX1F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.expenses = [];
        window.monthlyBudget = 500.00;
        let selectedCategoryFilter = null;
        let trendChartInstance = null, categoryChartInstance = null, gaugeChartInstance = null;

        const categoryMeta = {
            'Food': { icon: 'fa-utensils', color: '#3b82f6' },
            'Transport': { icon: 'fa-car', color: '#10b981' },
            'Entertainment': { icon: 'fa-gamepad', color: '#ec4899' },
            'Shopping': { icon: 'fa-bag-shopping', color: '#8b5cf6' },
            'Health': { icon: 'fa-heart-pulse', color: '#ef4444' },
            'Other': { icon: 'fa-box-archive', color: '#64748b' }
        };

        function getCurrentYearMonth() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        }

        function getTodayDateString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        window.handleMonthChange = function(inputEl) {
            if (!inputEl.value) {
                inputEl.value = getCurrentYearMonth();
            }
            updateAll();
        };

        window.resetTrendZoom = function() {
            if (trendChartInstance) {
                trendChartInstance.resetZoom();
            }
        };

        window.manualRefresh = function() {
            const btnIcon = document.querySelector('#refreshBtn i');
            btnIcon.classList.add('fa-spin');
            
            get(ref(db, 'expenses')).then((snapshot) => {
                const data = snapshot.val();
                window.expenses = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
                updateSyncStatus(true);
                updateAll();
                setTimeout(() => btnIcon.classList.remove('fa-spin'), 600);
            }).catch(() => {
                updateSyncStatus(false);
                btnIcon.classList.remove('fa-spin');
            });
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('trendMonthSelect').value = getCurrentYearMonth();
            document.getElementById('date').valueAsDate = new Date();

            onValue(ref(db, 'expenses'), (snapshot) => {
                const data = snapshot.val();
                window.expenses = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
                updateSyncStatus(true);
                updateAll();
            }, () => updateSyncStatus(false));

            onValue(ref(db, 'budget'), (snapshot) => {
                const val = snapshot.val();
                window.monthlyBudget = val !== null ? parseFloat(val) : 500.00;
                document.getElementById('budgetLimitText').innerText = `$${window.monthlyBudget.toFixed(2)}`;
                updateAll();
            });
        });

        function updateSyncStatus(isLive) {
            document.getElementById('syncStatus').className = `w-1.5 h-1.5 rounded-full ${isLive ? 'bg-emerald-500' : 'bg-rose-500'} inline-block`;
            document.getElementById('syncText').innerText = isLive ? 'Synced' : 'Error';
        }

        window.updateAll = function() {
            updateKPIs();
            updateCharts();
            renderTransactions();
            updateFilterBadgeUI();
        }

        window.openModal = function(id = null) {
            const modal = document.getElementById('expenseModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('modal-open');

            if (id) {
                document.getElementById('modalTitle').innerText = 'Edit Expense';
                const item = window.expenses.find(ex => ex.id === id);
                if (item) {
                    document.getElementById('expenseId').value = item.id;
                    document.getElementById('title').value = item.title;
                    document.getElementById('amount').value = item.amount;
                    document.getElementById('date').value = item.date;
                    document.getElementById('category').value = item.category;
                    document.getElementById('paymentMethod').value = item.paymentMethod === 'Mobile Wallet' ? 'Octopus' : item.paymentMethod;
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Add Expense';
                document.getElementById('expenseForm').reset();
                document.getElementById('expenseId').value = '';
                document.getElementById('date').valueAsDate = new Date();
            }
        }

        window.closeModal = function() {
            const modal = document.getElementById('expenseModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        window.saveExpense = function(e) {
            e.preventDefault();
            const id = document.getElementById('expenseId').value;
            let method = document.getElementById('paymentMethod').value;
            if (method === 'Mobile Wallet') method = 'Octopus';

            const data = {
                title: document.getElementById('title').value,
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                paymentMethod: method
            };
            if (id) update(ref(db, `expenses/${id}`), data);
            else set(push(ref(db, 'expenses')), data);
            closeModal();
        }

        window.deleteExpense = function(id) {
            if (confirm('Delete expense?')) remove(ref(db, `expenses/${id}`));
        }

        window.promptBudgetThreshold = function() {
            const input = prompt("Set monthly budget ($):", window.monthlyBudget);
            if (input !== null && !isNaN(input) && Number(input) > 0) set(ref(db, 'budget'), parseFloat(input));
        }

        window.filterByCategory = function(cat) {
            selectedCategoryFilter = cat;
            document.getElementById('filterCategory').value = cat || "";
            updateAll();
        }

        window.onCategorySelectFilter = function(val) {
            selectedCategoryFilter = val || null;
            updateAll();
        }

        window.clearCategoryFilter = function() {
            selectedCategoryFilter = null;
            document.getElementById('filterCategory').value = "";
            updateAll();
        }

        function updateFilterBadgeUI() {
            const badge = document.getElementById('activeFilterBadge');
            if (selectedCategoryFilter) {
                badge.classList.remove('hidden'); badge.classList.add('flex');
                document.getElementById('filterBadgeText').innerText = selectedCategoryFilter;
            } else {
                badge.classList.add('hidden'); badge.classList.remove('flex');
            }
        }

        function updateKPIs() {
            const todayStr = getTodayDateString();
            
            // Filter global dataset by category first for cross-filtering KPIs & gauges
            const baseFiltered = window.expenses.filter(ex => {
                if (!ex.date || ex.date > todayStr) return false;
                if (selectedCategoryFilter && ex.category !== selectedCategoryFilter) return false;
                return true;
            });

            const todayExp = baseFiltered.filter(ex => ex.date === todayStr);
            const todayTotal = todayExp.reduce((s, ex) => s + ex.amount, 0);
            document.getElementById('kpiToday').innerText = `$${todayTotal.toFixed(2)}`;

            let selectedYM = document.getElementById('trendMonthSelect').value;
            if (!selectedYM) selectedYM = getCurrentYearMonth();
            const [selYear, selMonth] = selectedYM.split('-').map(Number);

            document.getElementById('kpiMonthName').innerText = new Date(selYear, selMonth - 1, 1).toLocaleString('default', { month: 'short' });

            const monthExp = baseFiltered.filter(ex => ex.date && ex.date.startsWith(selectedYM));
            const monthTotal = monthExp.reduce((s, ex) => s + ex.amount, 0);
            document.getElementById('kpiMonth').innerText = `$${monthTotal.toFixed(2)}`;

            const now = new Date();
            let elapsedDays = 0;
            if (selYear === now.getFullYear() && selMonth === (now.getMonth() + 1)) {
                elapsedDays = now.getDate();
            } else if (selYear < now.getFullYear() || (selYear === now.getFullYear() && selMonth < (now.getMonth() + 1))) {
                elapsedDays = new Date(selYear, selMonth, 0).getDate();
            } else {
                elapsedDays = 0;
            }

            const dailyAvg = elapsedDays > 0 ? monthTotal / elapsedDays : 0;
            document.getElementById('kpiDailyAvg').innerText = `$${dailyAvg.toFixed(2)}`;

            // Weekly Average calculation based on elapsed weeks / completed weeks in month
            const elapsedWeeks = elapsedDays > 0 ? Math.max(elapsedDays / 7, 1) : 1;
            const weeklyAvg = monthTotal / elapsedWeeks;
            document.getElementById('kpiWeeklyAvg').innerText = `$${weeklyAvg.toFixed(2)}`;

            const pct = window.monthlyBudget > 0 ? Math.min(Math.round((monthTotal / window.monthlyBudget) * 100), 100) : 0;
            document.getElementById('gaugePercentage').innerText = `${pct}%`;

            if (gaugeChartInstance) gaugeChartInstance.destroy();
            gaugeChartInstance = new Chart(document.getElementById('gaugeChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [Math.min(monthTotal, window.monthlyBudget), Math.max(window.monthlyBudget - monthTotal, 0)],
                        backgroundColor: [monthTotal > window.monthlyBudget ? '#ef4444' : '#3b82f6', '#1e293b'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, circumference: 180, rotation: 270, plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '75%' }
            });
        }

        window.updateCharts = function() {
            let selectedYM = document.getElementById('trendMonthSelect').value;
            if (!selectedYM) {
                selectedYM = getCurrentYearMonth();
                document.getElementById('trendMonthSelect').value = selectedYM;
            }

            const viewMode = document.getElementById('trendViewMode').value;
            const [year, month] = selectedYM.split('-').map(Number);
            const now = new Date();
            const todayStr = getTodayDateString();

            const filteredExp = window.expenses.filter(ex => {
                if (!ex.date) return false;
                if (ex.date > todayStr) return false;
                return ex.date.startsWith(selectedYM) && (!selectedCategoryFilter || ex.category === selectedCategoryFilter);
            });

            let labels = [], data = [];
            if (viewMode === 'daily') {
                const daysInMonth = new Date(year, month, 0).getDate();
                const lastDayToInclude = (year === now.getFullYear() && month === (now.getMonth() + 1)) ? now.getDate() : daysInMonth;
                
                const sums = {};
                for (let i = 1; i <= lastDayToInclude; i++) {
                    sums[`${selectedYM}-${String(i).padStart(2, '0')}`] = 0;
                }
                filteredExp.forEach(ex => { if (sums[ex.date] !== undefined) sums[ex.date] += ex.amount; });
                labels = Object.keys(sums).map(d => parseInt(d.split('-')[2]));
                data = Object.values(sums);
            } else {
                // Correct weekly calculation aligned by calendar weeks of the specific month
                // W1: Days 1-7, W2: Days 8-14, W3: Days 15-21, W4: Days 22-28, W5: Day 29+
                const weeks = { 'W1': 0, 'W2': 0, 'W3': 0, 'W4': 0, 'W5': 0 };
                filteredExp.forEach(ex => {
                    const d = parseInt(ex.date.split('-')[2]);
                    if (d <= 7) weeks['W1'] += ex.amount;
                    else if (d <= 14) weeks['W2'] += ex.amount;
                    else if (d <= 21) weeks['W3'] += ex.amount;
                    else if (d <= 28) weeks['W4'] += ex.amount;
                    else weeks['W5'] += ex.amount;
                });
                labels = Object.keys(weeks); 
                data = Object.values(weeks);
            }

            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(document.getElementById('trendChart').getContext('2d'), {
                type: 'line',
                data: { labels, datasets: [{ data, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2, fill: true, tension: 0.3, pointRadius: 3, pointHoverRadius: 5 }] },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            callbacks: {
                                title: function(context) {
                                    return viewMode === 'daily' ? `${selectedYM}-${String(context[0].label).padStart(2, '0')}` : context[0].label;
                                },
                                label: function(context) {
                                    return `Spent: $${context.raw.toFixed(2)}`;
                                }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x'
                            },
                            pan: {
                                enabled: true,
                                mode: 'x'
                            }
                        }
                    }, 
                    scales: { 
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 } } }, 
                        y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 9 } } } 
                    } 
                }
            });

            // Category doughnut chart should reflect the selected month range filter
            const rawMonth = window.expenses.filter(ex => ex.date && ex.date.startsWith(selectedYM) && ex.date <= todayStr);
            const catTotals = {};
            rawMonth.forEach(ex => { catTotals[ex.category] = (catTotals[ex.category] || 0) + ex.amount; });

            const catLabels = Object.keys(categoryMeta);
            const catData = catLabels.map(cat => catTotals[cat] || 0);
            const catColors = catLabels.map(cat => categoryMeta[cat].color);

            if (categoryChartInstance) categoryChartInstance.destroy();
            categoryChartInstance = new Chart(document.getElementById('categoryChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: catLabels, datasets: [{ data: catData, backgroundColor: catColors, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '70%', onClick: (e, els) => { if (els.length) filterByCategory(selectedCategoryFilter === catLabels[els[0].index] ? null : catLabels[els[0].index]); } }
            });

            const totalM = catData.reduce((a, b) => a + b, 0);
            const legend = document.getElementById('categoryLegend');
            legend.innerHTML = '';
            catLabels.forEach((cat, i) => {
                const amt = catData[i];
                if (amt > 0 || !selectedCategoryFilter) {
                    const isSel = selectedCategoryFilter === cat;
                    legend.innerHTML += `
                        <div onclick="filterByCategory('${isSel ? '' : cat}')" class="flex items-center justify-between p-1 rounded-lg cursor-pointer transition ${isSel ? 'bg-blue-500/20 border border-blue-500/40' : 'hover:bg-slate-800/40'}">
                            <div class="flex items-center space-x-1.5 truncate">
                                <span class="w-2 h-2 rounded-full flex-shrink-0" style="background-color: ${catColors[i]}"></span>
                                <span class="text-slate-200 text-[11px] truncate">${cat}</span>
                            </div>
                            <div class="font-semibold text-slate-100 text-[11px]">$${amt.toFixed(0)}</div>
                        </div>`;
                }
            });
        }

        window.renderTransactions = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const catF = selectedCategoryFilter || document.getElementById('filterCategory').value;
            const selectedYM = document.getElementById('trendMonthSelect').value || getCurrentYearMonth();
            
            const filtered = window.expenses.filter(ex => {
                if (!ex.title || !ex.date) return false;
                if (!ex.date.startsWith(selectedYM)) return false; // Cross-filtered by month selector
                if (catF && ex.category !== catF) return false;
                return ex.title.toLowerCase().includes(search);
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const list = document.getElementById('transactionList');
            list.innerHTML = filtered.length === 0 ? `<div class="py-4 text-center text-slate-500 text-xs">No records</div>` : '';
            filtered.forEach(ex => {
                const m = categoryMeta[ex.category] || categoryMeta['Other'];
                const displayMethod = ex.paymentMethod === 'Mobile Wallet' ? 'Octopus' : ex.paymentMethod;
                list.innerHTML += `
                    <div class="py-2 flex items-center justify-between hover:bg-slate-800/30 px-1.5 rounded-lg">
                        <div class="flex items-center space-x-2.5 truncate">
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 text-xs" style="background-color: ${m.color}20; color: ${m.color}">
                                <i class="fa-solid ${m.icon}"></i>
                            </div>
                            <div class="truncate">
                                <h4 class="font-medium text-xs text-slate-200 truncate">${ex.title}</h4>
                                <div class="text-[10px] text-slate-400">${ex.date} • ${ex.category} • ${displayMethod}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            <span class="font-bold text-xs text-rose-400">-$${ex.amount.toFixed(2)}</span>
                            <button onclick="openModal('${ex.id}')" class="text-slate-500 hover:text-blue-400 p-1"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button onclick="deleteExpense('${ex.id}')" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
