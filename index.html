<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker & Dashboard</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-24 md:pb-8">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-wallet text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">ExpenseFlow</h1>
                    <p class="text-xs text-slate-400">Daily Finance Dashboard</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl text-sm font-medium shadow-md shadow-blue-600/30 transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Add Expense</span>
                </button>
                <div class="relative">
                    <button onclick="toggleMenu()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1 z-50">
                        <button onclick="exportData()" class="w-full text-left px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-download w-5 text-blue-400"></i><span>Export Backup</span>
                        </button>
                        <label class="w-full text-left px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-800 flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-upload w-5 text-emerald-400"></i><span>Import Backup</span>
                            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow space-y-6">

        <!-- KPI Summary Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider">
                    <span>Total Expenses</span>
                    <i class="fa-solid fa-coins text-blue-400"></i>
                </div>
                <div id="kpiTotal" class="text-2xl font-bold mt-2 text-slate-100">$0.00</div>
                <div class="text-xs text-slate-500 mt-1">All recorded time</div>
            </div>
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider">
                    <span>This Month</span>
                    <i class="fa-solid fa-calendar-days text-emerald-400"></i>
                </div>
                <div id="kpiMonth" class="text-2xl font-bold mt-2 text-slate-100">$0.00</div>
                <div id="kpiMonthName" class="text-xs text-emerald-400 mt-1">Current month</div>
            </div>
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider">
                    <span>Daily Average</span>
                    <i class="fa-solid fa-chart-line text-amber-400"></i>
                </div>
                <div id="kpiDailyAvg" class="text-2xl font-bold mt-2 text-slate-100">$0.00</div>
                <div class="text-xs text-slate-500 mt-1">This month avg</div>
            </div>
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider">
                    <span>Top Category</span>
                    <i class="fa-solid fa-tag text-purple-400"></i>
                </div>
                <div id="kpiTopCategory" class="text-xl font-bold mt-2 text-slate-100 truncate">None</div>
                <div id="kpiTopCatAmount" class="text-xs text-purple-400 mt-1">$0.00 spent</div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Daily Spending Trend Line Chart -->
            <div class="lg:col-span-2 bg-slate-900/90 border border-slate-800/80 rounded-2xl p-5 shadow-sm flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold text-base text-slate-200">Spending Trend</h2>
                    <input type="month" id="trendMonthSelect" class="bg-slate-800 border border-slate-700 text-xs rounded-xl px-3 py-1.5 text-slate-300 focus:outline-none focus:border-blue-500" onchange="updateCharts()">
                </div>
                <div class="relative flex-grow h-64 md:h-72">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Category Doughnut Chart -->
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-5 shadow-sm flex flex-col">
                <h2 class="font-semibold text-base text-slate-200 mb-4">Category Breakdown</h2>
                <div class="relative h-48 flex justify-center items-center">
                    <canvas id="categoryChart"></canvas>
                </div>
                <div id="categoryLegend" class="mt-4 space-y-2 overflow-y-auto max-h-36 pr-1 text-xs"></div>
            </div>
        </div>

        <!-- Transactions Section -->
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-5 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 mb-5">
                <h2 class="font-semibold text-base text-slate-200">Recent Transactions</h2>
                
                <!-- Search & Filters -->
                <div class="flex flex-wrap items-center gap-2">
                    <div class="relative flex-grow md:flex-grow-0">
                        <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
                        <input type="text" id="searchInput" placeholder="Search title..." class="bg-slate-800 border border-slate-700 text-xs rounded-xl pl-8 pr-3 py-2 text-slate-200 focus:outline-none focus:border-blue-500 w-full md:w-48" oninput="renderTransactions()">
                    </div>
                    <select id="filterCategory" class="bg-slate-800 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-300 focus:outline-none focus:border-blue-500" onchange="renderTransactions()">
                        <option value="">All Categories</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities & Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health & Fitness</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Transactions List -->
            <div id="transactionList" class="divide-y divide-slate-800/60 overflow-x-auto">
                <!-- Populated via JavaScript -->
            </div>
        </div>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 px-6 py-3 flex justify-around items-center z-30">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center text-blue-500 text-xs">
            <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
            <span>Dashboard</span>
        </button>
        <button onclick="openModal()" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 -mt-6 border-4 border-slate-950">
            <i class="fa-solid fa-plus text-lg"></i>
        </button>
        <button onclick="scrollToTransactions()" class="flex flex-col items-center text-slate-400 text-xs hover:text-slate-200">
            <i class="fa-solid fa-list-ul text-lg mb-0.5"></i>
            <span>History</span>
        </button>
    </div>

    <!-- Add/Edit Modal -->
    <div id="expenseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-150">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-100">Add New Expense</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="expenseForm" onsubmit="saveExpense(event)" class="space-y-4">
                <input type="hidden" id="expenseId">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Title / Description</label>
                    <input type="text" id="title" required placeholder="e.g., Grocery shopping, Coffee" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Date</label>
                        <input type="date" id="date" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
                        <select id="category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="Food">Food & Dining</option>
                            <option value="Transport">Transport</option>
                            <option value="Utilities">Utilities & Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health & Fitness</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Payment Method</label>
                        <select id="paymentMethod" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Mobile Wallet">Mobile Wallet</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition">Save Expense</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Category Icons & Colors mapping
        const categoryMeta = {
            'Food': { icon: 'fa-utensils', color: '#3b82f6' },
            'Transport': { icon: 'fa-car', color: '#10b981' },
            'Utilities': { icon: 'fa-bolt', color: '#f59e0b' },
            'Entertainment': { icon: 'fa-gamepad', color: '#ec4899' },
            'Shopping': { icon: 'fa-bag-shopping', color: '#8b5cf6' },
            'Health': { icon: 'fa-heart-pulse', color: '#ef4444' },
            'Other': { icon: 'fa-box-archive', color: '#64748b' }
        };

        let expenses = JSON.parse(localStorage.getItem('expenses')) || [
            { id: '1', title: 'Morning Coffee', amount: 4.50, date: new Date().toISOString().split('T')[0], category: 'Food', paymentMethod: 'Mobile Wallet' },
            { id: '2', title: 'Groceries at Supermarket', amount: 65.20, date: new Date(Date.now()-86400000).toISOString().split('T')[0], category: 'Food', paymentMethod: 'Credit Card' },
            { id: '3', title: 'Subway Monthly Pass', amount: 85.00, date: new Date(Date.now()-172800000).toISOString().split('T')[0], category: 'Transport', paymentMethod: 'Credit Card' }
        ];

        let trendChartInstance = null;
        let categoryChartInstance = null;

        window.addEventListener('DOMContentLoaded', () => {
            // Set default month selector value to current year-month
            const now = new Date();
            const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('trendMonthSelect').value = yearMonth;
            document.getElementById('date').valueAsDate = new Date();

            updateAll();
        });

        function updateAll() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
            updateKPIs();
            updateCharts();
            renderTransactions();
        }

        function scrollToTransactions() {
            document.getElementById('searchInput').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', (e) => {
            if (!e.target.closest('#dropdownMenu') && !e.target.closest('button[onclick="toggleMenu()"]')) {
                document.getElementById('dropdownMenu').classList.add('hidden');
            }
        });

        function openModal(id = null) {
            document.getElementById('expenseModal').classList.remove('hidden');
            if (id) {
                document.getElementById('modalTitle').innerText = 'Edit Expense';
                const item = expenses.find(ex => ex.id === id);
                if (item) {
                    document.getElementById('expenseId').value = item.id;
                    document.getElementById('title').value = item.title;
                    document.getElementById('amount').value = item.amount;
                    document.getElementById('date').value = item.date;
                    document.getElementById('category').value = item.category;
                    document.getElementById('paymentMethod').value = item.paymentMethod;
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Add New Expense';
                document.getElementById('expenseForm').reset();
                document.getElementById('expenseId').value = '';
                document.getElementById('date').valueAsDate = new Date();
            }
        }

        function closeModal() {
            document.getElementById('expenseModal').classList.add('hidden');
        }

        function saveExpense(e) {
            e.preventDefault();
            const id = document.getElementById('expenseId').value;
            const title = document.getElementById('title').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;
            const paymentMethod = document.getElementById('paymentMethod').value;

            if (id) {
                expenses = expenses.map(ex => ex.id === id ? { id, title, amount, date, category, paymentMethod } : ex);
            } else {
                const newEx = { id: Date.now().toString(), title, amount, date, category, paymentMethod };
                expenses.push(newEx);
            }

            closeModal();
            updateAll();
        }

        function deleteExpense(id) {
            if (confirm('Are you sure you want to delete this expense?')) {
                expenses = expenses.filter(ex => ex.id !== id);
                updateAll();
            }
        }

        function updateKPIs() {
            const total = expenses.reduce((sum, ex) => sum + ex.amount, 0);
            document.getElementById('kpiTotal').innerText = `$${total.toFixed(2)}`;

            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });
            document.getElementById('kpiMonthName').innerText = monthName;

            const monthExpenses = expenses.filter(ex => ex.date.startsWith(currentMonthStr));
            const monthTotal = monthExpenses.reduce((sum, ex) => sum + ex.amount, 0);
            document.getElementById('kpiMonth').innerText = `$${monthTotal.toFixed(2)}`;

            const dayOfMonth = now.getDate();
            const dailyAvg = dayOfMonth > 0 ? monthTotal / dayOfMonth : 0;
            document.getElementById('kpiDailyAvg').innerText = `$${dailyAvg.toFixed(2)}`;

            // Top Category
            const catTotals = {};
            monthExpenses.forEach(ex => {
                catTotals[ex.category] = (catTotals[ex.category] || 0) + ex.amount;
            });
            let topCat = 'None';
            let topAmt = 0;
            for (const [cat, amt] of Object.entries(catTotals)) {
                if (amt > topAmt) {
                    topAmt = amt;
                    topCat = cat;
                }
            }
            document.getElementById('kpiTopCategory').innerText = topCat;
            document.getElementById('kpiTopCatAmount').innerText = `$${topAmt.toFixed(2)} spent`;
        }

        function updateCharts() {
            const selectedYM = document.getElementById('trendMonthSelect').value;
            
            // --- Trend Chart ---
            const [year, month] = selectedYM.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            
            const dailySums = {};
            for (let i = 1; i <= daysInMonth; i++) {
                const dayStr = `${selectedYM}-${String(i).padStart(2, '0')}`;
                dailySums[dayStr] = 0;
            }

            expenses.filter(ex => ex.date.startsWith(selectedYM)).forEach(ex => {
                if (dailySums[ex.date] !== undefined) {
                    dailySums[ex.date] += ex.amount;
                }
            });

            const labels = Object.keys(dailySums).map(d => parseInt(d.split('-')[2]));
            const data = Object.values(dailySums);

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();

            trendChartInstance = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Spending',
                        data: data,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 10 } } }
                    }
                }
            });

            // --- Category Doughnut Chart (Current Month) ---
            const monthExpenses = expenses.filter(ex => ex.date.startsWith(selectedYM));
            const catTotals = {};
            monthExpenses.forEach(ex => {
                catTotals[ex.category] = (catTotals[ex.category] || 0) + ex.amount;
            });

            const catLabels = Object.keys(categoryMeta);
            const catData = catLabels.map(cat => catTotals[cat] || 0);
            const catColors = catLabels.map(cat => categoryMeta[cat].color);

            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            if (categoryChartInstance) categoryChartInstance.destroy();

            categoryChartInstance = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: catLabels,
                    datasets: [{
                        data: catData,
                        backgroundColor: catColors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    cutout: '70%'
                }
            });

            // Render Custom Legend
            const totalMonthExp = catData.reduce((a, b) => a + b, 0);
            const legendContainer = document.getElementById('categoryLegend');
            legendContainer.innerHTML = '';
            catLabels.forEach((cat, index) => {
                const amt = catData[index];
                if (amt > 0) {
                    const pct = totalMonthExp > 0 ? ((amt / totalMonthExp) * 100).toFixed(1) : 0;
                    legendContainer.innerHTML += `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2 truncate">
                                <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${catColors[index]}"></span>
                                <span class="text-slate-300 truncate">${cat}</span>
                            </div>
                            <div class="font-medium text-slate-200">$${amt.toFixed(2)} <span class="text-slate-500 text-[10px]">(${pct}%)</span></div>
                        </div>
                    `;
                }
            });
            if (totalMonthExp === 0) {
                legendContainer.innerHTML = `<p class="text-slate-500 text-center py-4">No expenses recorded for this month.</p>`;
            }
        }

        function renderTransactions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const catFilter = document.getElementById('filterCategory').value;

            const filtered = expenses.filter(ex => {
                const matchTitle = ex.title.toLowerCase().includes(search);
                const matchCat = catFilter ? ex.category === catFilter : true;
                return matchTitle && matchCat;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const listContainer = document.getElementById('transactionList');
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="py-8 text-center text-slate-500 text-sm">No transactions found.</div>`;
                return;
            }

            filtered.forEach(ex => {
                const meta = categoryMeta[ex.category] || categoryMeta['Other'];
                listContainer.innerHTML += `
                    <div class="py-3 flex items-center justify-between hover:bg-slate-800/40 px-2 rounded-xl transition">
                        <div class="flex items-center space-x-3 truncate">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color: ${meta.color}20; color: ${meta.color}">
                                <i class="fa-solid ${meta.icon}"></i>
                            </div>
                            <div class="truncate">
                                <h4 class="font-medium text-sm text-slate-200 truncate">${ex.title}</h4>
                                <div class="flex items-center space-x-2 text-xs text-slate-400 mt-0.5">
                                    <span>${ex.date}</span>
                                    <span>•</span>
                                    <span class="bg-slate-800 px-2 py-0.5 rounded-md text-[10px] text-slate-300">${ex.category}</span>
                                    <span>•</span>
                                    <span class="text-slate-500">${ex.paymentMethod}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            <span class="font-bold text-sm text-rose-400">-$${ex.amount.toFixed(2)}</span>
                            <div class="flex items-center space-x-1">
                                <button onclick="openModal('${ex.id}')" class="p-1.5 text-slate-400 hover:text-blue-400 transition">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteExpense('${ex.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(expenses, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `expenses_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        expenses = imported;
                        updateAll();
                        alert('Data imported successfully!');
                    } else {
                        alert('Invalid backup file format.');
                    }
                } catch (err) {
                    alert('Error parsing JSON file.');
                }
            };
            reader.readAsText(file);
        }
    </script>

    <!-- Service Worker Registration Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered!', reg))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
